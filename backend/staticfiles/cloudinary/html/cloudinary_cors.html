        };

        };

    // Función propia que recibe los parámetros de la URL (?usuario=juan&id=5) y los convierte a formato JSON.
    function parse(query) {
      var result = {};                        // Inicializa un objeto de JavaScript vacío para almacenar los parámetros procesados.
      var params = query.split("&");          // Rompe el texto de la URL en un arreglo separando cada par de parámetros por el carácter '&'.
      for (var i = 0; i < params.length; i++) { // Bucle que itera uno por uno cada parámetro extraído del arreglo.
        var param = params[i].split("=");     // Rompe el parámetro actual en dos partes separándolo por el carácter '=', aislando la clave del valor.
        result[param[0]] = decodeURIComponent(param[1]); // Guarda en el objeto la clave (param[0]) asignándole su valor decodificado (param[1]) para resolver espacios o símbolos de URL.
      }
      return JSON.stringify(result);          // Convierte el objeto con todos los parámetros recopilados a una cadena de texto estructurada en JSON limpio.
    }

    // Obtiene la query string de la URL (eliminando el signo '?'), la procesa con la función parse() e inyecta el JSON final directamente como contenido visible de la página web.
    document.body.textContent = document.body.innerText = parse(window.location.search.slice(1));
